[project]
name = "quietz"
version = "0.1.0"
description = "Monitors declared as data, with alert rules generated from them and unit tested in both directions"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pyyaml>=6.0.3", "types-pyyaml>=6.0.12.20260815"]

[tool.hatch.build.targets.wheel]
packages = ["src/quietz"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.mypy]
files = ["src", "tests", "scripts"]
strict = true
