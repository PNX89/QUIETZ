text{fill:#d6d5ce;white-space:pre;dominant-baseline:middle}
text.cmd{fill:#d9a441;font-weight:600}
@keyframes l0{0%,0.000%{opacity:0}0.000%,100%{opacity:1}}@keyframes l1{0%,0.930%{opacity:0}0.940%,100%{opacity:1}}@keyframes l2{0%,1.870%{opacity:0}1.880%,100%{opacity:1}}@keyframes l3{0%,2.811%{opacity:0}2.821%,100%{opacity:1}}@keyframes l4{0%,3.751%{opacity:0}3.761%,100%{opacity:1}}@keyframes l5{0%,4.691%{opacity:0}4.701%,100%{opacity:1}}@keyframes l6{0%,5.631%{opacity:0}5.641%,100%{opacity:1}}@keyframes l7{0%,6.571%{opacity:0}6.581%,100%{opacity:1}}@keyframes l8{0%,7.511%{opacity:0}7.521%,100%{opacity:1}}@keyframes l9{0%,8.452%{opacity:0}8.462%,100%{opacity:1}}@keyframes l10{0%,9.392%{opacity:0}9.402%,100%{opacity:1}}@keyframes l11{0%,10.332%{opacity:0}10.342%,100%{opacity:1}}@keyframes l12{0%,11.272%{opacity:0}11.282%,100%{opacity:1}}@keyframes l13{0%,12.212%{opacity:0}12.222%,100%{opacity:1}}@keyframes l14{0%,13.152%{opacity:0}13.162%,100%{opacity:1}}@keyframes l15{0%,14.093%{opacity:0}14.103%,100%{opacity:1}}@keyframes l16{0%,15.033%{opacity:0}15.043%,100%{opacity:1}}@keyframes l17{0%,15.973%{opacity:0}15.983%,100%{opacity:1}}@keyframes l18{0%,16.913%{opacity:0}16.923%,100%{opacity:1}}@keyframes l19{0%,17.853%{opacity:0}17.863%,100%{opacity:1}}@keyframes l20{0%,18.793%{opacity:0}18.803%,100%{opacity:1}}@keyframes l21{0%,19.734%{opacity:0}19.744%,100%{opacity:1}}@keyframes l22{0%,20.674%{opacity:0}20.684%,100%{opacity:1}}@keyframes l23{0%,21.614%{opacity:0}21.624%,100%{opacity:1}}@keyframes l24{0%,22.554%{opacity:0}22.564%,100%{opacity:1}}@keyframes l25{0%,23.494%{opacity:0}23.504%,100%{opacity:1}}@keyframes l26{0%,24.434%{opacity:0}24.444%,100%{opacity:1}}@keyframes l27{0%,25.375%{opacity:0}25.385%,100%{opacity:1}}@keyframes l28{0%,26.315%{opacity:0}26.325%,100%{opacity:1}}@keyframes l29{0%,27.255%{opacity:0}27.265%,100%{opacity:1}}
</style>
<rect width="842" height="621" rx="8" fill="#14141a"/>
<circle cx="20" cy="15" r="5" fill="#e05a51"/><circle cx="38" cy="15" r="5" fill="#e0b341"/><circle cx="56" cy="15" r="5" fill="#57b95a"/>
<text x="18" y="34" class="cmd" style="animation:l0 5850ms steps(1,end) infinite">$ uv run python examples/what_gets_you_woken.py</text><text x="18" y="53" style="animation:l1 5850ms steps(1,end) infinite"></text><text x="18" y="72" style="animation:l2 5850ms steps(1,end) infinite">4 monitors, and every one of them is a row somebody has to review.</text><text x="18" y="91" style="animation:l3 5850ms steps(1,end) infinite"></text><text x="18" y="110" style="animation:l4 5850ms steps(1,end) infinite">  monitor                           owner           within   complete  goes to</text><text x="18" y="129" style="animation:l5 5850ms steps(1,end) infinite">  ecb_reference_rate_freshness      data-platform   1d       100%      oncall</text><text x="18" y="148" style="animation:l6 5850ms steps(1,end) infinite">  ecb_reference_rate_completeness   data-platform   2d       98%       data-platform</text><text x="18" y="167" style="animation:l7 5850ms steps(1,end) infinite">  ecb_yield_curve_freshness         research        2d       95%       data-platform</text><text x="18" y="186" style="animation:l8 5850ms steps(1,end) infinite">  ecb_bank_rates_completeness       research        3d       90%       none</text><text x="18" y="205" style="animation:l9 5850ms steps(1,end) infinite"></text><text x="18" y="224" style="animation:l10 5850ms steps(1,end) infinite">  Only one of them wakes anybody, and the registry refuses to let that change by</text><text x="18" y="243" style="animation:l11 5850ms steps(1,end) infinite">  accident: a monitor that pages on a window longer than two trading days is rejected</text><text x="18" y="262" style="animation:l12 5850ms steps(1,end) infinite">  in the constructor, because waking somebody for a feed allowed to be three days late</text><text x="18" y="281" style="animation:l13 5850ms steps(1,end) infinite">  is how a rota learns to ignore the pager.</text><text x="18" y="300" style="animation:l14 5850ms steps(1,end) infinite"></text><text x="18" y="319" style="animation:l15 5850ms steps(1,end) infinite">The windows are in TRADING days. From Friday 2026-08-28 to Monday 2026-08-31 is</text><text x="18" y="338" style="animation:l16 5850ms steps(1,end) infinite">  1 trading day, not 3, so a feed that publishes on business days is not late on a</text><text x="18" y="357" style="animation:l17 5850ms steps(1,end) infinite">  Sunday and nobody is woken for a weekend.</text><text x="18" y="376" style="animation:l18 5850ms steps(1,end) infinite"></text><text x="18" y="395" style="animation:l19 5850ms steps(1,end) infinite">And when two of these feeds break and keep breaking:</text><text x="18" y="414" style="animation:l20 5850ms steps(1,end) infinite"></text><text x="18" y="433" style="animation:l21 5850ms steps(1,end) infinite">  24 alert firings</text><text x="18" y="452" style="animation:l22 5850ms steps(1,end) infinite">  2 notifications a human receives</text><text x="18" y="471" style="animation:l23 5850ms steps(1,end) infinite">    oncall           1</text><text x="18" y="490" style="animation:l24 5850ms steps(1,end) infinite">    ticket           1</text><text x="18" y="509" style="animation:l25 5850ms steps(1,end) infinite"></text><text x="18" y="528" style="animation:l26 5850ms steps(1,end) infinite">  The completeness alerts are absent on purpose. A feed that has not delivered at all</text><text x="18" y="547" style="animation:l27 5850ms steps(1,end) infinite">  cannot be incomplete in any interesting way, so it is suppressed while the freshness</text><text x="18" y="566" style="animation:l28 5850ms steps(1,end) infinite"></text><text x="18" y="585" style="animation:l29 5850ms steps(1,end) infinite">... 1 more lines, in full on the card</text>
</svg>
