name: CI

# Nothing here needs a credential and nothing here reaches a cloud account.
#
# The offline suite checks that the committed rules are what the registry generates. The rules
# themselves are checked and unit tested by promtool in its own job, because that needs
# Prometheus and the boundary of the test rig stays legible.
#
# NO `schedule:` in any workflow here. Third-party actions are pinned by commit.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: lint, types and the offline suite
    uses: PNX89/.github/.github/workflows/checks.yml@v1
    with:
      python-versions: '["3.11", "3.12", "3.13"]'
      sync-args: "--dev"
      run-mypy: true

  # The rules, checked and then unit tested. `check rules` says a file parses; it says nothing
  # about whether an alert fires when it should, and nothing at all about whether it stays quiet
  # when it should, which is the half that decides whether anybody keeps reading the alerts.
  rules:
    name: the alert rules, unit tested in both directions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: regenerate the rules from the registry
        run: uv run python scripts/generate_rules.py
      - name: fail if the committed rules are not what the registry produces
        run: |
          git status --porcelain rules
          git diff --exit-code -- rules
          test -z "$(git status --porcelain rules)"
      - name: check and unit test them with promtool
        run: |
          docker run --rm -v "$PWD/rules":/rules -w /rules \
            --entrypoint promtool prom/prometheus:v3.7.3 check rules generated.yml
          docker run --rm -v "$PWD/rules":/rules -w /rules \
            --entrypoint promtool prom/prometheus:v3.7.3 test rules generated_test.yml
